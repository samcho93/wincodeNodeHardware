<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a-core" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d6fd1"/></marker><marker id="a-power" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker><marker id="a-net" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a085"/></marker><marker id="a-io" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8e44ad"/></marker><marker id="a-motor" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d35400"/></marker><marker id="a-safe" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b00020"/></marker><marker id="a-pix" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2c3e50"/></marker><marker id="a-ext" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs><rect width="100%" height="100%" fill="#fbfbfc"/><text x="20" y="30" font-size="18" font-weight="bold" fill="#222" text-anchor="start">WN-DMX2 — eDMX node, 2 DMX512 ports (core board + isolated RS-485 per port)</text><rect x="20" y="60" width="230" height="250" rx="6" fill="#fff" stroke="#1d6fd1" stroke-width="2"/><rect x="20" y="60" width="230" height="22" rx="6" fill="#1d6fd1"/><rect x="20" y="74" width="230" height="8" fill="#1d6fd1"/><text x="28" y="76" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">Core board (ESP32)</text><text x="28" y="98" font-size="11" font-weight="normal" fill="#222" text-anchor="start">UART1  TX GPIO4 · RX GPIO35</text><text x="28" y="113" font-size="11" font-weight="normal" fill="#222" text-anchor="start">       DE GPIO5</text><text x="28" y="128" font-size="11" font-weight="normal" fill="#222" text-anchor="start">UART2  TX GPIO13 · RX GPIO36</text><text x="28" y="143" font-size="11" font-weight="normal" fill="#222" text-anchor="start">       DE GPIO14</text><text x="28" y="158" font-size="11" font-weight="normal" fill="#222" text-anchor="start"></text><text x="28" y="173" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO2  status LED</text><text x="28" y="188" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO15 button</text><text x="28" y="203" font-size="11" font-weight="normal" fill="#222" text-anchor="start">250 kbit/s 8N2, break by</text><text x="28" y="218" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  inverting TX (120 µs)</text><rect x="330" y="60" width="260" height="200" rx="6" fill="#fff" stroke="#8e44ad" stroke-width="2"/><rect x="330" y="60" width="260" height="22" rx="6" fill="#8e44ad"/><rect x="330" y="74" width="260" height="8" fill="#8e44ad"/><text x="338" y="76" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">U31  ADM2587E (port 1)</text><text x="338" y="98" font-size="11" font-weight="normal" fill="#222" text-anchor="start">isolated RS-485 transceiver</text><text x="338" y="113" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  with its own isolated 5 V</text><text x="338" y="128" font-size="11" font-weight="normal" fill="#222" text-anchor="start">3.3 V logic side: DI ← TX,</text><text x="338" y="143" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  RO → RX, DE + /RE ← DE pin</text><text x="338" y="158" font-size="11" font-weight="normal" fill="#222" text-anchor="start">bus side: A, B, isolated GND</text><text x="338" y="173" font-size="11" font-weight="normal" fill="#222" text-anchor="start">2.5 kV isolation (the DMX</text><text x="338" y="188" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  line never reaches the ESP32)</text><path d="M250,100 L290,100 L290,120 L330,120" fill="none" stroke="#8e44ad" stroke-width="1.6" marker-end="url(#a-io)"/><text x="256" y="94" font-size="10" font-weight="normal" fill="#8e44ad" text-anchor="start">TX / RX / DE 1</text><rect x="670" y="60" width="220" height="200" rx="6" fill="#fff" stroke="#2c3e50" stroke-width="2"/><rect x="670" y="60" width="220" height="22" rx="6" fill="#2c3e50"/><rect x="670" y="74" width="220" height="8" fill="#2c3e50"/><text x="678" y="76" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">J31  5-pin XLR</text><text x="678" y="98" font-size="11" font-weight="normal" fill="#222" text-anchor="start">female: out (DMX to fixtures)</text><text x="678" y="113" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  pin 1 GND (isolated)</text><text x="678" y="128" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  pin 2 data − (B)</text><text x="678" y="143" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  pin 3 data + (A)</text><text x="678" y="158" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  pins 4, 5 unused</text><text x="678" y="173" font-size="11" font-weight="normal" fill="#222" text-anchor="start">male version for DMX in</text><text x="678" y="188" font-size="11" font-weight="normal" fill="#222" text-anchor="start">status LED: green = live,</text><text x="678" y="203" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  yellow = hold, red = loss</text><path d="M590,160 L670,160" fill="none" stroke="#2c3e50" stroke-width="1.6" marker-end="url(#a-pix)"/><text x="598" y="154" font-size="10" font-weight="normal" fill="#2c3e50" text-anchor="start">A / B / GND</text><rect x="950" y="60" width="220" height="200" rx="6" fill="#fff" stroke="#b00020" stroke-width="2"/><rect x="950" y="60" width="220" height="22" rx="6" fill="#b00020"/><rect x="950" y="74" width="220" height="8" fill="#b00020"/><text x="958" y="76" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">Port 1 protection</text><text x="958" y="98" font-size="11" font-weight="normal" fill="#222" text-anchor="start">120 Ω termination, jumper</text><text x="958" y="113" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  (DMX in, or end of line)</text><text x="958" y="128" font-size="11" font-weight="normal" fill="#222" text-anchor="start">SM712 TVS on A / B</text><text x="958" y="143" font-size="11" font-weight="normal" fill="#222" text-anchor="start">2 × 4.7 Ω series in A / B</text><text x="958" y="158" font-size="11" font-weight="normal" fill="#222" text-anchor="start">shield to chassis via</text><text x="958" y="173" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  1 nF / 2 kV</text><path d="M890,160 L950,160" fill="none" stroke="#b00020" stroke-width="1.6" marker-end="url(#a-safe)"/><rect x="330" y="330" width="260" height="200" rx="6" fill="#fff" stroke="#8e44ad" stroke-width="2"/><rect x="330" y="330" width="260" height="22" rx="6" fill="#8e44ad"/><rect x="330" y="344" width="260" height="8" fill="#8e44ad"/><text x="338" y="346" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">U32  ADM2587E (port 2)</text><text x="338" y="368" font-size="11" font-weight="normal" fill="#222" text-anchor="start">isolated RS-485 transceiver</text><text x="338" y="383" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  with its own isolated 5 V</text><text x="338" y="398" font-size="11" font-weight="normal" fill="#222" text-anchor="start">3.3 V logic side: DI ← TX,</text><text x="338" y="413" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  RO → RX, DE + /RE ← DE pin</text><text x="338" y="428" font-size="11" font-weight="normal" fill="#222" text-anchor="start">bus side: A, B, isolated GND</text><text x="338" y="443" font-size="11" font-weight="normal" fill="#222" text-anchor="start">2.5 kV isolation (the DMX</text><text x="338" y="458" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  line never reaches the ESP32)</text><path d="M250,220 L290,220 L290,390 L330,390" fill="none" stroke="#8e44ad" stroke-width="1.6" marker-end="url(#a-io)"/><text x="256" y="214" font-size="10" font-weight="normal" fill="#8e44ad" text-anchor="start">TX / RX / DE 2</text><rect x="670" y="330" width="220" height="200" rx="6" fill="#fff" stroke="#2c3e50" stroke-width="2"/><rect x="670" y="330" width="220" height="22" rx="6" fill="#2c3e50"/><rect x="670" y="344" width="220" height="8" fill="#2c3e50"/><text x="678" y="346" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">J32  5-pin XLR</text><text x="678" y="368" font-size="11" font-weight="normal" fill="#222" text-anchor="start">female: out (DMX to fixtures)</text><text x="678" y="383" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  pin 1 GND (isolated)</text><text x="678" y="398" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  pin 2 data − (B)</text><text x="678" y="413" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  pin 3 data + (A)</text><text x="678" y="428" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  pins 4, 5 unused</text><text x="678" y="443" font-size="11" font-weight="normal" fill="#222" text-anchor="start">male version for DMX in</text><text x="678" y="458" font-size="11" font-weight="normal" fill="#222" text-anchor="start">status LED: green = live,</text><text x="678" y="473" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  yellow = hold, red = loss</text><path d="M590,430 L670,430" fill="none" stroke="#2c3e50" stroke-width="1.6" marker-end="url(#a-pix)"/><text x="598" y="424" font-size="10" font-weight="normal" fill="#2c3e50" text-anchor="start">A / B / GND</text><rect x="950" y="330" width="220" height="200" rx="6" fill="#fff" stroke="#b00020" stroke-width="2"/><rect x="950" y="330" width="220" height="22" rx="6" fill="#b00020"/><rect x="950" y="344" width="220" height="8" fill="#b00020"/><text x="958" y="346" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">Port 2 protection</text><text x="958" y="368" font-size="11" font-weight="normal" fill="#222" text-anchor="start">120 Ω termination, jumper</text><text x="958" y="383" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  (DMX in, or end of line)</text><text x="958" y="398" font-size="11" font-weight="normal" fill="#222" text-anchor="start">SM712 TVS on A / B</text><text x="958" y="413" font-size="11" font-weight="normal" fill="#222" text-anchor="start">2 × 4.7 Ω series in A / B</text><text x="958" y="428" font-size="11" font-weight="normal" fill="#222" text-anchor="start">shield to chassis via</text><text x="958" y="443" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  1 nF / 2 kV</text><path d="M890,430 L950,430" fill="none" stroke="#b00020" stroke-width="1.6" marker-end="url(#a-safe)"/><text x="20" y="580" font-size="11" font-weight="normal" fill="#555" text-anchor="start">DMX out: every frame is break (120 µs), mark-after-break (16 µs), start code 0 and 512 slots — 22.7 ms on the wire, so at most 44 frames a second.</text><text x="20" y="596" font-size="11" font-weight="normal" fill="#555" text-anchor="start">Several senders on one universe are merged on the node: HTP = the highest value per channel, LTP = the latest change. After 2.5 s without a sender</text><text x="20" y="612" font-size="11" font-weight="normal" fill="#555" text-anchor="start">the port holds the last frame or goes dark (blackout). DMX in: a break starts a frame; every frame goes out as ArtDmx (broadcast) or sACN (multicast).</text><text x="20" y="636" font-size="11" font-weight="bold" fill="#222" text-anchor="start">Four or eight ports need more than the two free UARTs: those boards drive the lines from the RMT peripheral (next revision). RDM is not built yet.</text></svg>
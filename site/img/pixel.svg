<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 620" width="1180" height="620" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a-core" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d6fd1"/></marker><marker id="a-power" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker><marker id="a-net" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a085"/></marker><marker id="a-io" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8e44ad"/></marker><marker id="a-motor" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d35400"/></marker><marker id="a-safe" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b00020"/></marker><marker id="a-pix" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2c3e50"/></marker><marker id="a-ext" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs><rect width="100%" height="100%" fill="#fbfbfc"/><text x="20" y="30" font-size="18" font-weight="bold" fill="#222" text-anchor="start">WN-PIX4 — pixel node, 4 outputs (core board + level shifter + power distribution)</text><rect x="20" y="60" width="230" height="200" rx="6" fill="#fff" stroke="#1d6fd1" stroke-width="2"/><rect x="20" y="60" width="230" height="22" rx="6" fill="#1d6fd1"/><rect x="20" y="74" width="230" height="8" fill="#1d6fd1"/><text x="28" y="76" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">Core board (ESP32)</text><text x="28" y="98" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO4  → output 1</text><text x="28" y="113" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO5  → output 2</text><text x="28" y="128" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO13 → output 3</text><text x="28" y="143" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO14 → output 4</text><text x="28" y="158" font-size="11" font-weight="normal" fill="#222" text-anchor="start"></text><text x="28" y="173" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO2  status LED</text><text x="28" y="188" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO15 button</text><text x="28" y="203" font-size="11" font-weight="normal" fill="#222" text-anchor="start">RMT: one channel per output</text><rect x="320" y="60" width="230" height="160" rx="6" fill="#fff" stroke="#8e44ad" stroke-width="2"/><rect x="320" y="60" width="230" height="22" rx="6" fill="#8e44ad"/><rect x="320" y="74" width="230" height="8" fill="#8e44ad"/><text x="328" y="76" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">U20  74HCT245 at 5 V</text><text x="328" y="98" font-size="11" font-weight="normal" fill="#222" text-anchor="start">four channels, 3.3 V → 5 V</text><text x="328" y="113" font-size="11" font-weight="normal" fill="#222" text-anchor="start">OE low, DIR high, 100 nF</text><text x="328" y="128" font-size="11" font-weight="normal" fill="#222" text-anchor="start">each output: 33 Ω series</text><text x="328" y="143" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  + 100 Ω to the connector</text><text x="328" y="158" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  (ringing on long data lines)</text><path d="M250,100 L320,100" fill="none" stroke="#8e44ad" stroke-width="1.6" marker-end="url(#a-io)"/><text x="289.0" y="96.0" font-size="10" font-weight="normal" fill="#8e44ad" text-anchor="start">D1</text><path d="M250,125 L320,125" fill="none" stroke="#8e44ad" stroke-width="1.6" marker-end="url(#a-io)"/><text x="289.0" y="121.0" font-size="10" font-weight="normal" fill="#8e44ad" text-anchor="start">D2</text><path d="M250,150 L320,150" fill="none" stroke="#8e44ad" stroke-width="1.6" marker-end="url(#a-io)"/><text x="289.0" y="146.0" font-size="10" font-weight="normal" fill="#8e44ad" text-anchor="start">D3</text><path d="M250,175 L320,175" fill="none" stroke="#8e44ad" stroke-width="1.6" marker-end="url(#a-io)"/><text x="289.0" y="171.0" font-size="10" font-weight="normal" fill="#8e44ad" text-anchor="start">D4</text><rect x="640" y="60" width="250" height="280" rx="6" fill="#fff" stroke="#2c3e50" stroke-width="2"/><rect x="640" y="60" width="250" height="22" rx="6" fill="#2c3e50"/><rect x="640" y="74" width="250" height="8" fill="#2c3e50"/><text x="648" y="76" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">J20–J23  outputs</text><text x="648" y="98" font-size="11" font-weight="normal" fill="#222" text-anchor="start">4 × 3-pin (V+, data, GND)</text><text x="648" y="113" font-size="11" font-weight="normal" fill="#222" text-anchor="start">per output: ATO fuse 7.5 A</text><text x="648" y="128" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  and a green LED on V+</text><text x="648" y="143" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GND shared with the logic</text><text x="648" y="158" font-size="11" font-weight="normal" fill="#222" text-anchor="start">data: up to 10 m to the first</text><text x="648" y="173" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  pixel; further with a</text><text x="648" y="188" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  differential extender</text><text x="648" y="203" font-size="11" font-weight="normal" fill="#222" text-anchor="start"></text><text x="648" y="218" font-size="11" font-weight="normal" fill="#222" text-anchor="start">max per output:</text><text x="648" y="233" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  4096 pixels in config; real</text><text x="648" y="248" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  limit = 40 fps × wire time</text><path d="M550,140 L640,140" fill="none" stroke="#2c3e50" stroke-width="1.6" marker-end="url(#a-pix)"/><text x="562" y="134" font-size="10" font-weight="normal" fill="#2c3e50" text-anchor="start">data 1–4</text><rect x="960" y="60" width="200" height="280" rx="6" fill="#fff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="960" y="60" width="200" height="22" rx="6" fill="#555"/><rect x="960" y="74" width="200" height="8" fill="#555"/><text x="968" y="76" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">Pixel strips</text><text x="968" y="98" font-size="11" font-weight="normal" fill="#222" text-anchor="start">WS2812B / WS2811 / SK6812</text><text x="968" y="113" font-size="11" font-weight="normal" fill="#222" text-anchor="start">SK6812-RGBW, UCS2903</text><text x="968" y="128" font-size="11" font-weight="normal" fill="#222" text-anchor="start">(APA102 needs a clock line:</text><text x="968" y="143" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  not built in this revision)</text><text x="968" y="158" font-size="11" font-weight="normal" fill="#222" text-anchor="start"></text><text x="968" y="173" font-size="11" font-weight="normal" fill="#222" text-anchor="start">5 V: inject every 2 m</text><text x="968" y="188" font-size="11" font-weight="normal" fill="#222" text-anchor="start">12 V: every 5 m</text><text x="968" y="203" font-size="11" font-weight="normal" fill="#222" text-anchor="start"></text><text x="968" y="218" font-size="11" font-weight="normal" fill="#222" text-anchor="start">170 RGB / 127 RGBW pixels</text><text x="968" y="233" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  per universe</text><path d="M890,200 L960,200" fill="none" stroke="#2c3e50" stroke-width="1.6" marker-end="url(#a-pix)"/><rect x="320" y="300" width="230" height="160" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/><rect x="320" y="300" width="230" height="22" rx="6" fill="#c0392b"/><rect x="320" y="314" width="230" height="8" fill="#c0392b"/><text x="328" y="316" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">Pixel power</text><text x="328" y="338" font-size="11" font-weight="normal" fill="#222" text-anchor="start">J24: 5 V or 12 V in, 2 × M5</text><text x="328" y="353" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  ring terminals, up to 40 A</text><text x="328" y="368" font-size="11" font-weight="normal" fill="#222" text-anchor="start">distributed through the four</text><text x="328" y="383" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  fuses; logic does NOT take</text><text x="328" y="398" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  current from this rail</text><path d="M550,380 L600,380 L600,300 L640,300" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a-power)"/><text x="560" y="374" font-size="10" font-weight="normal" fill="#c0392b" text-anchor="start">V+ 40 A</text><rect x="20" y="300" width="230" height="160" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/><rect x="20" y="300" width="230" height="22" rx="6" fill="#c0392b"/><rect x="20" y="314" width="230" height="8" fill="#c0392b"/><text x="28" y="316" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">Logic power</text><text x="28" y="338" font-size="11" font-weight="normal" fill="#222" text-anchor="start">J1 on the core board:</text><text x="28" y="353" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  12–24 V DC, 0.5 A</text><text x="28" y="368" font-size="11" font-weight="normal" fill="#222" text-anchor="start">(or a 5 V-in variant: fit a</text><text x="28" y="383" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  jumper instead of U1)</text><text x="28" y="398" font-size="11" font-weight="normal" fill="#222" text-anchor="start">separate from the pixel rail</text><path d="M250,380 L320,380" fill="none" stroke="#c0392b" stroke-width="1.6"/><text x="20" y="510" font-size="11" font-weight="normal" fill="#555" text-anchor="start">The firmware maps channels exactly like the Node Manager simulator (renderPixels() in vdevice.js): R, G, B (, W) per controlled</text><text x="20" y="526" font-size="11" font-weight="normal" fill="#555" text-anchor="start">pixel; the first universe starts at startChannel, every following universe at channel 1; group, reverse, limit and gamma are</text><text x="20" y="542" font-size="11" font-weight="normal" fill="#555" text-anchor="start">applied on the node; `order` only says how the chip wants the colours on the wire.</text><text x="20" y="566" font-size="11" font-weight="bold" fill="#222" text-anchor="start">Power budget: 60 mA per WS2812B pixel at full white — 300 pixels = 18 A at 5 V. Use `limit` to stay inside the supply and the fuses.</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="1200" height="820" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a-core" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d6fd1"/></marker><marker id="a-power" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker><marker id="a-net" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a085"/></marker><marker id="a-io" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8e44ad"/></marker><marker id="a-motor" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d35400"/></marker><marker id="a-safe" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b00020"/></marker><marker id="a-pix" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2c3e50"/></marker><marker id="a-ext" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs><rect width="100%" height="100%" fill="#fbfbfc"/><text x="20" y="30" font-size="18" font-weight="bold" fill="#222" text-anchor="start">WN-WINCH — kinetic winch (core board + motion I/O + lamp output)</text><rect x="20" y="60" width="230" height="300" rx="6" fill="#fff" stroke="#1d6fd1" stroke-width="2"/><rect x="20" y="60" width="230" height="22" rx="6" fill="#1d6fd1"/><rect x="20" y="74" width="230" height="8" fill="#1d6fd1"/><text x="28" y="76" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">Core board (ESP32)</text><text x="28" y="98" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO4  → STEP</text><text x="28" y="113" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO5  → DIR</text><text x="28" y="128" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO17 → ENABLE</text><text x="28" y="143" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO2  → BRAKE release</text><text x="28" y="158" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO13 → lamp data</text><text x="28" y="173" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO34 ← top limit</text><text x="28" y="188" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO35 ← bottom limit</text><text x="28" y="203" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO36 ← driver alarm</text><text x="28" y="218" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO39 ← E-stop chain sense</text><text x="28" y="233" font-size="11" font-weight="normal" fill="#222" text-anchor="start"></text><text x="28" y="248" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO14 status LED</text><text x="28" y="263" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO15 button</text><rect x="320" y="60" width="210" height="130" rx="6" fill="#fff" stroke="#8e44ad" stroke-width="2"/><rect x="320" y="60" width="210" height="22" rx="6" fill="#8e44ad"/><rect x="320" y="74" width="210" height="8" fill="#8e44ad"/><text x="328" y="76" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">U10  74HCT245 at 5 V</text><text x="328" y="98" font-size="11" font-weight="normal" fill="#222" text-anchor="start">3.3 V in → 5 V out</text><text x="328" y="113" font-size="11" font-weight="normal" fill="#222" text-anchor="start">STEP, DIR, ENABLE, lamp</text><text x="328" y="128" font-size="11" font-weight="normal" fill="#222" text-anchor="start">OE tied low; DIR high</text><text x="328" y="143" font-size="11" font-weight="normal" fill="#222" text-anchor="start">100 nF at VCC</text><path d="M250,90 L320,90" fill="none" stroke="#8e44ad" stroke-width="1.6" marker-end="url(#a-io)"/><text x="289.0" y="86.0" font-size="10" font-weight="normal" fill="#8e44ad" text-anchor="start">STEP</text><path d="M250,115 L320,115" fill="none" stroke="#8e44ad" stroke-width="1.6" marker-end="url(#a-io)"/><text x="289.0" y="111.0" font-size="10" font-weight="normal" fill="#8e44ad" text-anchor="start">DIR</text><path d="M250,140 L320,140" fill="none" stroke="#8e44ad" stroke-width="1.6" marker-end="url(#a-io)"/><text x="289.0" y="136.0" font-size="10" font-weight="normal" fill="#8e44ad" text-anchor="start">ENA</text><rect x="600" y="60" width="280" height="150" rx="6" fill="#fff" stroke="#d35400" stroke-width="2"/><rect x="600" y="60" width="280" height="22" rx="6" fill="#d35400"/><rect x="600" y="74" width="280" height="8" fill="#d35400"/><text x="608" y="76" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">Stepper driver (external)</text><text x="608" y="98" font-size="11" font-weight="normal" fill="#222" text-anchor="start">closed loop, e.g. HBS86H / CL86T</text><text x="608" y="113" font-size="11" font-weight="normal" fill="#222" text-anchor="start">PUL+ DIR+ ENA+ ← 74HCT245 (5 V)</text><text x="608" y="128" font-size="11" font-weight="normal" fill="#222" text-anchor="start">PUL− DIR− ENA− → GND</text><text x="608" y="143" font-size="11" font-weight="normal" fill="#222" text-anchor="start">1600 steps / rev (12.73 steps / mm</text><text x="608" y="158" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  on a 40 mm drum)</text><text x="608" y="173" font-size="11" font-weight="normal" fill="#222" text-anchor="start">ALM (open collector) → U12</text><path d="M530,100 L600,100" fill="none" stroke="#d35400" stroke-width="1.6" marker-end="url(#a-motor)"/><rect x="940" y="60" width="220" height="150" rx="6" fill="#fff" stroke="#d35400" stroke-width="2"/><rect x="940" y="60" width="220" height="22" rx="6" fill="#d35400"/><rect x="940" y="74" width="220" height="8" fill="#d35400"/><text x="948" y="76" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">M1  NEMA 34 + brake</text><text x="948" y="98" font-size="11" font-weight="normal" fill="#222" text-anchor="start">hybrid stepper + encoder</text><text x="948" y="113" font-size="11" font-weight="normal" fill="#222" text-anchor="start">24 V spring-applied brake</text><text x="948" y="128" font-size="11" font-weight="normal" fill="#222" text-anchor="start">drum 40 mm, wire rope</text><text x="948" y="143" font-size="11" font-weight="normal" fill="#222" text-anchor="start">gearbox optional: change</text><text x="948" y="158" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  steps / mm in menuconfig</text><path d="M880,120 L940,120" fill="none" stroke="#d35400" stroke-width="1.6" marker-end="url(#a-motor)"/><rect x="320" y="230" width="210" height="110" rx="6" fill="#fff" stroke="#d35400" stroke-width="2"/><rect x="320" y="230" width="210" height="22" rx="6" fill="#d35400"/><rect x="320" y="244" width="210" height="8" fill="#d35400"/><text x="328" y="246" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">Q10  brake switch</text><text x="328" y="268" font-size="11" font-weight="normal" fill="#222" text-anchor="start">AO3400 N-MOSFET, gate 100 Ω</text><text x="328" y="283" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  + 100 k to GND (closed at boot)</text><text x="328" y="298" font-size="11" font-weight="normal" fill="#222" text-anchor="start">SS34 flyback diode</text><text x="328" y="313" font-size="11" font-weight="normal" fill="#222" text-anchor="start">→ M1 brake coil (24 V via K2)</text><path d="M250,160 L290,160 L290,270 L320,270" fill="none" stroke="#d35400" stroke-width="1.6" marker-end="url(#a-motor)"/><text x="256" y="154" font-size="10" font-weight="normal" fill="#d35400" text-anchor="start">BRAKE</text><rect x="320" y="380" width="210" height="150" rx="6" fill="#fff" stroke="#8e44ad" stroke-width="2"/><rect x="320" y="380" width="210" height="22" rx="6" fill="#8e44ad"/><rect x="320" y="394" width="210" height="8" fill="#8e44ad"/><text x="328" y="396" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">U11–U14  PC817 inputs</text><text x="328" y="418" font-size="11" font-weight="normal" fill="#222" text-anchor="start">24 V side: 2.2 k + LED</text><text x="328" y="433" font-size="11" font-weight="normal" fill="#222" text-anchor="start">ESP32 side: 10 k pull-up</text><text x="328" y="448" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  to 3.3 V, 100 nF</text><text x="328" y="463" font-size="11" font-weight="normal" fill="#222" text-anchor="start">low = active (fail-safe:</text><text x="328" y="478" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  a cut wire reads "pressed")</text><path d="M320,420 L250,420 L250,250" fill="none" stroke="#8e44ad" stroke-width="1.6" marker-end="url(#a-io)"/><text x="244" y="350" font-size="10" font-weight="normal" fill="#8e44ad" text-anchor="end">GPIO34·35·36·39</text><rect x="600" y="380" width="260" height="110" rx="6" fill="#fff" stroke="#b00020" stroke-width="2"/><rect x="600" y="380" width="260" height="22" rx="6" fill="#b00020"/><rect x="600" y="394" width="260" height="8" fill="#b00020"/><text x="608" y="396" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">Limit switches</text><text x="608" y="418" font-size="11" font-weight="normal" fill="#222" text-anchor="start">S1 top (home reference), NC</text><text x="608" y="433" font-size="11" font-weight="normal" fill="#222" text-anchor="start">S2 bottom (over-travel), NC</text><text x="608" y="448" font-size="11" font-weight="normal" fill="#222" text-anchor="start">mechanical, 24 V, wired to the</text><text x="608" y="463" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  drum frame</text><path d="M600,430 L530,430" fill="none" stroke="#b00020" stroke-width="1.6" marker-end="url(#a-safe)"/><text x="545" y="424" font-size="10" font-weight="normal" fill="#b00020" text-anchor="start">24 V NC</text><rect x="600" y="520" width="260" height="200" rx="6" fill="#fff" stroke="#b00020" stroke-width="2"/><rect x="600" y="520" width="260" height="22" rx="6" fill="#b00020"/><rect x="600" y="534" width="260" height="8" fill="#b00020"/><text x="608" y="536" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">E-stop chain (hardware)</text><text x="608" y="558" font-size="11" font-weight="normal" fill="#222" text-anchor="start">NC buttons in series, 24 V</text><text x="608" y="573" font-size="11" font-weight="normal" fill="#222" text-anchor="start">K1 safety relay (e.g. PNOZ s3 /</text><text x="608" y="588" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  PSR-ESAM4), two channels</text><text x="608" y="603" font-size="11" font-weight="normal" fill="#222" text-anchor="start">K2 contactor: motor supply AND</text><text x="608" y="618" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  brake supply — cut when the</text><text x="608" y="633" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  chain opens, whatever the</text><text x="608" y="648" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  firmware does</text><text x="608" y="663" font-size="11" font-weight="normal" fill="#222" text-anchor="start">K1 auxiliary contact → U14 → GPIO39</text><path d="M600,600 L560,600 L560,500 L530,500" fill="none" stroke="#b00020" stroke-width="1.6" marker-end="url(#a-safe)"/><text x="566" y="594" font-size="10" font-weight="normal" fill="#b00020" text-anchor="start">aux</text><rect x="940" y="260" width="220" height="130" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/><rect x="940" y="260" width="220" height="22" rx="6" fill="#c0392b"/><rect x="940" y="274" width="220" height="8" fill="#c0392b"/><text x="948" y="276" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">Motor supply</text><text x="948" y="298" font-size="11" font-weight="normal" fill="#222" text-anchor="start">48 V DC 7 A (driver input)</text><text x="948" y="313" font-size="11" font-weight="normal" fill="#222" text-anchor="start">through K2 main contacts</text><text x="948" y="328" font-size="11" font-weight="normal" fill="#222" text-anchor="start">24 V for the brake through K2</text><path d="M860,640 L1180,640 L1180,340 L1160,340" fill="none" stroke="#b00020" stroke-width="1.6" marker-end="url(#a-safe)"/><text x="880" y="634" font-size="10" font-weight="normal" fill="#b00020" text-anchor="start">K2 cuts motor and brake power</text><path d="M940,320 L870,320 L870,210" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a-power)"/><text x="876" y="300" font-size="10" font-weight="normal" fill="#c0392b" text-anchor="start">48 V</text><rect x="940" y="420" width="220" height="150" rx="6" fill="#fff" stroke="#2c3e50" stroke-width="2"/><rect x="940" y="420" width="220" height="22" rx="6" fill="#2c3e50"/><rect x="940" y="434" width="220" height="8" fill="#2c3e50"/><text x="948" y="436" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">Lamp on the cable</text><text x="948" y="458" font-size="11" font-weight="normal" fill="#222" text-anchor="start">60 × WS2812B, 5 V</text><text x="948" y="473" font-size="11" font-weight="normal" fill="#222" text-anchor="start">74HCT245 → 33 Ω → data</text><text x="948" y="488" font-size="11" font-weight="normal" fill="#222" text-anchor="start">5 V 4 A buck on the lamp</text><text x="948" y="503" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  (24 V down the cable)</text><text x="948" y="518" font-size="11" font-weight="normal" fill="#222" text-anchor="start">cable: 3-core + data pair</text><path d="M530,170 L580,170 L580,360 L900,360 L900,470 L940,470" fill="none" stroke="#2c3e50" stroke-width="1.6" marker-end="url(#a-pix)"/><text x="590" y="352" font-size="10" font-weight="normal" fill="#2c3e50" text-anchor="start">lamp data (GPIO13)</text><rect x="20" y="400" width="230" height="160" rx="6" fill="#fff" stroke="#555" stroke-width="2" stroke-dasharray="6 4"/><rect x="20" y="400" width="230" height="22" rx="6" fill="#555"/><rect x="20" y="414" width="230" height="8" fill="#555"/><text x="28" y="416" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">Front panel</text><text x="28" y="438" font-size="11" font-weight="normal" fill="#222" text-anchor="start">RJ45 (core board)</text><text x="28" y="453" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Status LED</text><text x="28" y="468" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Button (factory reset)</text><text x="28" y="483" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Motor: Speakon / Harting</text><text x="28" y="498" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Lamp: 4-pin XLR</text><text x="28" y="513" font-size="11" font-weight="normal" fill="#222" text-anchor="start">E-stop: 5-pin XLR (loop)</text><text x="20" y="740" font-size="11" font-weight="normal" fill="#555" text-anchor="start">Safety is layered: the E-stop chain cuts motor and brake power in hardware; the firmware stops on the limit switches inside</text><text x="20" y="756" font-size="11" font-weight="normal" fill="#555" text-anchor="start">the step interrupt, clamps every target to the travel limits, ends a jog 1 s after its last command and closes the brake</text><text x="20" y="772" font-size="11" font-weight="normal" fill="#555" text-anchor="start">when the motor stands. Rigging over people needs a certified hoist design (e.g. DGUV V17 / BGV C1, IEC 60204-32): this</text><text x="20" y="788" font-size="11" font-weight="bold" fill="#b00020" text-anchor="start">diagram is a development reference, not a certified design.</text></svg>
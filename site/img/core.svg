<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" width="1100" height="620" font-family="Segoe UI, Arial, sans-serif"><defs><marker id="a-core" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1d6fd1"/></marker><marker id="a-power" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#c0392b"/></marker><marker id="a-net" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#16a085"/></marker><marker id="a-io" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8e44ad"/></marker><marker id="a-motor" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#d35400"/></marker><marker id="a-safe" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#b00020"/></marker><marker id="a-pix" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#2c3e50"/></marker><marker id="a-ext" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#555"/></marker></defs><rect width="100%" height="100%" fill="#fbfbfc"/><text x="20" y="30" font-size="18" font-weight="bold" fill="#222" text-anchor="start">Core board — shared by every Wincode node (ESP32 + Ethernet + power)</text><rect x="20" y="60" width="200" height="110" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/><rect x="20" y="60" width="200" height="22" rx="6" fill="#c0392b"/><rect x="20" y="74" width="200" height="8" fill="#c0392b"/><text x="28" y="76" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">J1  24 V DC in</text><text x="28" y="98" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Phoenix MSTB 2-pin</text><text x="28" y="113" font-size="11" font-weight="normal" fill="#222" text-anchor="start">P-MOSFET reverse protection</text><text x="28" y="128" font-size="11" font-weight="normal" fill="#222" text-anchor="start">SMBJ30A TVS · 2 A polyfuse</text><rect x="270" y="60" width="200" height="110" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/><rect x="270" y="60" width="200" height="22" rx="6" fill="#c0392b"/><rect x="270" y="74" width="200" height="8" fill="#c0392b"/><text x="278" y="76" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">U1  buck 24 V → 5 V</text><text x="278" y="98" font-size="11" font-weight="normal" fill="#222" text-anchor="start">MP2315 / TPS54331, 2 A</text><text x="278" y="113" font-size="11" font-weight="normal" fill="#222" text-anchor="start">22 µH · 2 × 22 µF</text><text x="278" y="128" font-size="11" font-weight="normal" fill="#222" text-anchor="start">5 V for level shifters, CH340</text><rect x="520" y="60" width="200" height="110" rx="6" fill="#fff" stroke="#c0392b" stroke-width="2"/><rect x="520" y="60" width="200" height="22" rx="6" fill="#c0392b"/><rect x="520" y="74" width="200" height="8" fill="#c0392b"/><text x="528" y="76" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">U2  3.3 V</text><text x="528" y="98" font-size="11" font-weight="normal" fill="#222" text-anchor="start">AMS1117-3.3 (or AP2112K)</text><text x="528" y="113" font-size="11" font-weight="normal" fill="#222" text-anchor="start">1 A, from 5 V</text><text x="528" y="128" font-size="11" font-weight="normal" fill="#222" text-anchor="start">10 µF in / 22 µF out</text><path d="M220,115 L270,115" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a-power)"/><text x="249.0" y="111.0" font-size="10" font-weight="normal" fill="#c0392b" text-anchor="start">24 V</text><path d="M470,115 L520,115" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a-power)"/><text x="499.0" y="111.0" font-size="10" font-weight="normal" fill="#c0392b" text-anchor="start">5 V</text><rect x="380" y="230" width="260" height="250" rx="6" fill="#fff" stroke="#1d6fd1" stroke-width="2"/><rect x="380" y="230" width="260" height="22" rx="6" fill="#1d6fd1"/><rect x="380" y="244" width="260" height="8" fill="#1d6fd1"/><text x="388" y="246" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">U3  ESP32-WROOM-32E (4 MB)</text><text x="388" y="268" font-size="11" font-weight="normal" fill="#222" text-anchor="start">EN: 10 k + 1 µF, auto-reset from CH340</text><text x="388" y="283" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO0 ← REF_CLK 50 MHz (boot: held high)</text><text x="388" y="298" font-size="11" font-weight="normal" fill="#222" text-anchor="start">RMII: TXD0 19 · TXD1 22 · TX_EN 21</text><text x="388" y="313" font-size="11" font-weight="normal" fill="#222" text-anchor="start">      RXD0 25 · RXD1 26 · CRS_DV 27</text><text x="388" y="328" font-size="11" font-weight="normal" fill="#222" text-anchor="start">SMI: MDC 23 · MDIO 18</text><text x="388" y="343" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO16 → oscillator enable</text><text x="388" y="358" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO32 (ADC1 4) ← V_IN / 11</text><text x="388" y="373" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO33 (ADC1 5) ← NTC 10 k B3950</text><text x="388" y="388" font-size="11" font-weight="normal" fill="#222" text-anchor="start">GPIO15 ← button (to GND)</text><text x="388" y="403" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Status LED: GPIO14 (winch) / GPIO2 (pixel)</text><text x="388" y="418" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Device I/O: see the winch and pixel sheets</text><text x="388" y="433" font-size="11" font-weight="normal" fill="#222" text-anchor="start">3.3 V: 10 µF + 100 nF at the module</text><path d="M620,170 L620,230" fill="none" stroke="#c0392b" stroke-width="1.6" marker-end="url(#a-power)"/><text x="626" y="205" font-size="10" font-weight="normal" fill="#c0392b" text-anchor="start">3.3 V</text><rect x="720" y="230" width="210" height="140" rx="6" fill="#fff" stroke="#16a085" stroke-width="2"/><rect x="720" y="230" width="210" height="22" rx="6" fill="#16a085"/><rect x="720" y="244" width="210" height="8" fill="#16a085"/><text x="728" y="246" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">U4  LAN8720A</text><text x="728" y="268" font-size="11" font-weight="normal" fill="#222" text-anchor="start">RMII PHY, address 1</text><text x="728" y="283" font-size="11" font-weight="normal" fill="#222" text-anchor="start">50 MHz oscillator, enable</text><text x="728" y="298" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  from GPIO16 (boot-safe)</text><text x="728" y="313" font-size="11" font-weight="normal" fill="#222" text-anchor="start">nINTSEL / REFCLKO: osc mode</text><text x="728" y="328" font-size="11" font-weight="normal" fill="#222" text-anchor="start">12.1 k RBIAS 1 %</text><rect x="960" y="230" width="120" height="140" rx="6" fill="#fff" stroke="#16a085" stroke-width="2"/><rect x="960" y="230" width="120" height="22" rx="6" fill="#16a085"/><rect x="960" y="244" width="120" height="8" fill="#16a085"/><text x="968" y="246" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">J2  RJ45</text><text x="968" y="268" font-size="11" font-weight="normal" fill="#222" text-anchor="start">HR911105A</text><text x="968" y="283" font-size="11" font-weight="normal" fill="#222" text-anchor="start">magnetics</text><text x="968" y="298" font-size="11" font-weight="normal" fill="#222" text-anchor="start">built in</text><text x="968" y="313" font-size="11" font-weight="normal" fill="#222" text-anchor="start">link / act</text><text x="968" y="328" font-size="11" font-weight="normal" fill="#222" text-anchor="start">LEDs</text><path d="M640,290 L720,290" fill="none" stroke="#16a085" stroke-width="1.6" marker-end="url(#a-net)"/><text x="660" y="284" font-size="10" font-weight="normal" fill="#16a085" text-anchor="start">RMII</text><path d="M720,330 L640,330" fill="none" stroke="#16a085" stroke-width="1.6" marker-end="url(#a-net)"/><text x="652" y="344" font-size="10" font-weight="normal" fill="#16a085" text-anchor="start">REF_CLK</text><path d="M930,300 L960,300" fill="none" stroke="#16a085" stroke-width="1.6" marker-end="url(#a-net)"/><rect x="20" y="230" width="300" height="130" rx="6" fill="#fff" stroke="#8e44ad" stroke-width="2"/><rect x="20" y="230" width="300" height="22" rx="6" fill="#8e44ad"/><rect x="20" y="244" width="300" height="8" fill="#8e44ad"/><text x="28" y="246" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">U5  USB-C programming</text><text x="28" y="268" font-size="11" font-weight="normal" fill="#222" text-anchor="start">CH340C (no crystal), 5 V from USB or U1</text><text x="28" y="283" font-size="11" font-weight="normal" fill="#222" text-anchor="start">DTR / RTS → 2 × S8050 → EN, GPIO0</text><text x="28" y="298" font-size="11" font-weight="normal" fill="#222" text-anchor="start">TX0 GPIO1 · RX0 GPIO3</text><text x="28" y="313" font-size="11" font-weight="normal" fill="#222" text-anchor="start">CC1 / CC2: 5.1 k to GND</text><path d="M320,300 L380,300" fill="none" stroke="#8e44ad" stroke-width="1.6" marker-end="url(#a-io)"/><text x="330" y="294" font-size="10" font-weight="normal" fill="#8e44ad" text-anchor="start">UART0</text><rect x="20" y="400" width="300" height="180" rx="6" fill="#fff" stroke="#8e44ad" stroke-width="2"/><rect x="20" y="400" width="300" height="22" rx="6" fill="#8e44ad"/><rect x="20" y="414" width="300" height="8" fill="#8e44ad"/><text x="28" y="416" font-size="12" font-weight="bold" fill="#fff" text-anchor="start">Board sensing</text><text x="28" y="438" font-size="11" font-weight="normal" fill="#222" text-anchor="start">V_IN: 100 k / 10 k → GPIO32, 100 nF</text><text x="28" y="453" font-size="11" font-weight="normal" fill="#222" text-anchor="start">NTC 10 k (next to the power stage)</text><text x="28" y="468" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  with 10 k to 3.3 V → GPIO33</text><text x="28" y="483" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Button: GPIO15 to GND, 10 k pull-up</text><text x="28" y="498" font-size="11" font-weight="normal" fill="#222" text-anchor="start">  held 5 s at power-up = factory</text><text x="28" y="513" font-size="11" font-weight="normal" fill="#222" text-anchor="start">Status LED: 1 k, GPIO14 / GPIO2</text><path d="M320,470 L380,470" fill="none" stroke="#8e44ad" stroke-width="1.6" marker-end="url(#a-io)"/><text x="326" y="464" font-size="10" font-weight="normal" fill="#8e44ad" text-anchor="start">ADC / GPIO</text><text x="380" y="520" font-size="11" font-weight="normal" fill="#555" text-anchor="start">Strapping pins: GPIO0 (REF_CLK input — the oscillator is enabled by GPIO16 after boot), GPIO2, GPIO5, GPIO12, GPIO15.</text><text x="380" y="538" font-size="11" font-weight="normal" fill="#555" text-anchor="start">GPIO12 stays unused (it would select 1.8 V flash if pulled high at boot). GPIO34–39 are inputs only, without pull-ups.</text><text x="380" y="556" font-size="11" font-weight="normal" fill="#555" text-anchor="start">Wi-Fi works as a fallback; show data at 40 frames per second wants the cable.</text></svg>